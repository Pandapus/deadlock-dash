# Typechecks the frontend and checks/lints the Rust side on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      # Builds dist/, which tauri::generate_context! needs at compile time.
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri
